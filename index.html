<!DOCTYPE html>
<html>
<head>
  <title>Tabela de Cálculos</title>
  <style>
* {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f0f0f0;
      color: #000;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }
    #adicionar-linha {
      background-color: #f00;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 50px;
      margin: 10px;
    }
    #download {
      background-color: #0f0;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 100px;
      margin: 10px;
    }
    .botoes {
      text-align: center;
      margin-top: 20px;
    }
    @media (min-width: 768px) {
      table {
        width: 80%;
        margin: 20px auto;
      }
      #adicionar-linha, #download {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <table id="tabela">
    <tr>
      <th>Descrição</th>
      <th>Valor (g)</th>
      <th>Resultado (g)</th>
    </tr>
    <tr>
      <td><input type="text" class="descricao"></td>
      <td><input type="text" class="valor" oninput="calculaResultado(this)"></td>
      <td class="resultado"></td>
    </tr>
  </table>
  <div class="botoes">
    <button id="adicionar-linha">+</button>
    <button id="download">Download</button>
  </div>

  <script>
    // Adiciona uma nova linha na tabela
    document.getElementById('adicionar-linha').addEventListener('click', function() {
      var tabela = document.getElementById('tabela');
      var novaLinha = tabela.insertRow(tabela.rows.length);
      novaLinha.innerHTML = `
        <td><input type="text" class="descricao"></td>
        <td><input type="text" class="valor" oninput="calculaResultado(this)"></td>
        <td class="resultado"></td>
      `;
    });

    // Calcula o resultado da soma
function calculaResultado(input) {
  var valor = input.value;
  var resultado = input.parentNode.nextElementSibling;
  try {
    var soma = eval(valor.replace(',', '.'));
    if (soma >= 1000) {
      resultado.textContent = (soma / 1000).toFixed(3) + ' kg';
    } else {
      resultado.textContent = soma + ' g';
    }
  } catch (e) {
    resultado.textContent = 'Erro';
  }
}

// Cria um arquivo txt com os dados da tabela
document.getElementById('download').addEventListener('click', function() {
  var tabela = document.getElementById('tabela');
  var dados = '';
  for (var i = 1; i < tabela.rows.length; i++) {
    var descricao = tabela.rows[i].cells[0].querySelector('input').value;
    var resultado = tabela.rows[i].cells[2].textContent;
    dados +=  descricao + ' : ' + resultado + '\n';
  }
  var blob = new Blob([dados], {type: 'text/plain'});
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'dados.txt';
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});
  </script>
</body>
</html>
