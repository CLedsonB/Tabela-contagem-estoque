<!DOCTYPE html>
<html>
<head>
      <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-8926739670176161">

  <meta name="author" content="CLedsonB">
  <meta name="description" content="Website com o intuito de calcula em tempo real pesos de produtos">
  <meta name="keywords" content="compras, lista de compras, compras sob controle">
  <meta name="robots" content="index,nofollow">
  <meta name="rating" content="18 years"/>
  <meta name="copyright" content="© 2026 - CLedsonB"/>
  
  <title>Tabela de Cálculos</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  border: none;
  box-sizing: border-box;
  list-style: none;
  text-decoration: none;
  outline: none;
}
    body { background-color: #000; font-family: Arial, sans-serif; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; border: 1px solid #ffffff;}
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background-color: #f0f0f0; color: #000; }
    input[type="text"] { width: 100%; padding: 10px; border: none; border-radius: 5px; background-color: #000000; color: #ffffff; text-align: center;}
    #adicionar-linha { background-color: #f00; color: #fff; border: none; padding: 10px; font-size: 30px; border-radius: 80%; cursor: pointer; width: 50px; height: 50px; margin: 10px; }
    #download { background-color: #2bb800; color: #fff; border: none; padding: 10px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100px; margin: 10px; }
    .botoes { text-align: center; margin-top: 20px; }
    @media (min-width: 768px) { table { width: 80%; margin: 20px auto; } #adicionar-linha, #download { width: auto; } }
  </style>
</head>
<body>
  <table id="tabela">
    <tr>
      <th>Descrição</th>
      <th>Valor (kg / g)</th>
      <th>Resultado (kg / g)</th>
    </tr>
  </table>
  <div class="botoes">
    <button id="adicionar-linha">+</button>
    <button id="download">Download</button>
  </div>
  <script>
    // Adiciona uma nova linha na tabela
    document.getElementById('adicionar-linha').addEventListener('click', function() {
      var tabela = document.getElementById('tabela');
      var novaLinha = tabela.insertRow(tabela.rows.length);
      novaLinha.innerHTML = `
        <td><input type="text" class="descricao" placeholder="Nome do Produto"></td>
        <td><input type="text" class="valor" oninput="calculaResultado(this)" placeholder="0.000"></td>
        <td class="resultado"></td>
      `;
    });

    // Calcula o resultado da soma
    function calculaResultado(input) {
      var valor = input.value;
      var resultado = input.parentNode.nextElementSibling;
      try {
        var soma = eval(valor.replace(',', '.'));
        if (soma >= 1000) {
          resultado.textContent = (soma / 1000).toFixed(3) + ' kg';
        } else {
          resultado.textContent = soma + ' g';
        }
      } catch (e) {
        resultado.textContent = 'Erro';
      }
    }

    // Cria um arquivo txt com os dados da tabela
    document.getElementById('download').addEventListener('click', function() {
      var nomeArquivo = prompt('Digite o nome do arquivo (padrão: dados.txt):');
      if (nomeArquivo === null || nomeArquivo.trim() === '') {
        nomeArquivo = 'dados.txt';
      } else {
        nomeArquivo += '.txt';
      }
      var tabela = document.getElementById('tabela');
      var dados = '';
      for (var i = 1; i < tabela.rows.length; i++) {
        var descricao = tabela.rows[i].cells[0].querySelector('input').value;
        var resultado = tabela.rows[i].cells[2].textContent;
        dados += descricao + ' : ' + resultado + '\n';
      }
      var blob = new Blob([dados], {type: 'text/plain;charset=UTF-8'});
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = nomeArquivo;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Função para salvar os dados da tabela no LocalStorage
    function salvarDados() {
      var tabela = document.getElementById('tabela');
      var dados = [];
      for (var i = 1; i < tabela.rows.length; i++) {
        var descricao = tabela.rows[i].cells[0].querySelector('input').value;
        var valor = tabela.rows[i].cells[1].querySelector('input').value;
        var resultado = tabela.rows[i].cells[2].textContent;
        dados.push({ descricao: descricao, valor: valor, resultado: resultado });
      }
      localStorage.setItem('dadosTabela', JSON.stringify(dados));
    }

    // Função para carregar os dados da tabela do LocalStorage
    function carregarDados() {
      var dados = localStorage.getItem('dadosTabela');
      if (dados) {
        dados = JSON.parse(dados);
        var tabela = document.getElementById('tabela');
        // Limpar a tabela
        while (tabela.rows.length > 1) {
          tabela.deleteRow(1);
        }
        // Adicionar os dados à tabela
        for (var i = 0; i < dados.length; i++) {
          var novaLinha = tabela.insertRow(tabela.rows.length);
          novaLinha.innerHTML = `
            <td><input type="text" class="descricao" value="${dados[i].descricao}"></td>
            <td><input type="text" class="valor" value="${dados[i].valor}" oninput="calculaResultado(this)"></td>
            <td class="resultado">${dados[i].resultado}</td>
          `;
        }
      }
    }

    // Função para ler o arquivo de texto e criar linhas na tabela
    function lerArquivo() {
      fetch('base.txt')
        .then(response => response.text())
        .then(data => {
          var linhas = data.split('\n');
          var tabela = document.getElementById('tabela');
          // Limpar a tabela
          while (tabela.rows.length > 1) {
            tabela.deleteRow(1);
          }
          // Adicionar os dados à tabela
          for (var i = 0; i < linhas.length; i++) {
            if (linhas[i].trim() !== '') {
              var novaLinha = tabela.insertRow(tabela.rows.length);
              novaLinha.innerHTML = `
                <td><input type="text" class="descricao" value="${linhas[i]}"></td>
                <td><input type="text" class="valor" oninput="calculaResultado(this)" placeholder="0.000"></td>
                <td class="resultado"></td>
              `;
            }
          }
        })
        .catch(error => console.error('Erro ao ler arquivo:', error));
    }

    // Chamar a função quando a página for carregada
    window.addEventListener('load', function() {
      carregarDados();
      lerArquivo();
    });

    // Salvar os dados quando o usuário sair da página
    window.addEventListener('beforeunload', salvarDados);
  </script>
</body>
</html>
